name: Desktop build and release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal ZIP (Apple Silicon + Intel)
            os: macos-15
            command: npm run package:mac:universal
            artifact: harmonic-lens-*-mac-universal.zip
          - label: Windows portable
            os: windows-latest
            command: npm run package:win
            artifact: harmonic-lens-*-win-x64.exe
          - label: Linux AppImage
            os: ubuntu-latest
            command: npm run package:linux
            artifact: harmonic-lens-*-linux-x86_64.AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      # Every native target first builds identical src/ Vite renderer into dist/.
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # The app must actually open and hear a (fake) microphone, not just build.
      - name: Smoke test (Linux, Electron + fake microphone)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb python3-pip
          python3 -m pip install --break-system-packages playwright numpy scipy
          # Electron 44 no longer downloads its binary on npm install; fetch it for the smoke test.
          node node_modules/electron/install.js
          python3 tools/e2e/synth_vowels.py /tmp/vowels
          HL_REAL_PERMISSIONS=1 xvfb-run -a python3 tools/e2e/run_electron.py /tmp/vowels.wav /tmp/electron 10
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # A tag with a hyphen (v0.1.0-beta.1) is published as a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Beta build. The apps are not signed or notarized: on macOS right-click the app and choose Open
            (or `xattr -dr com.apple.quarantine "/Applications/Harmonic Lens.app"`); on Windows choose More info,
            then Run anyway; on Linux `chmod +x` the AppImage. See the README for details.
