<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmonic Lens</title>
  </head>
  <body>
    <main id="app">
      <section class="workspace" aria-labelledby="app-title">
        <header class="topbar">
          <div>
            <h1 id="app-title">Harmonic Lens</h1>
            <p id="status">Idle. Audio stays muted locally.</p>
          </div>
          <div class="actions">
            <button id="startButton" type="button">Start microphone</button>
            <button id="stopButton" type="button" disabled>Stop</button>
          </div>
        </header>

        <section class="meter-row" aria-label="Live diagnostics">
          <dl>
            <div>
              <dt>Permission</dt>
              <dd id="permission">unknown</dd>
            </div>
            <div>
              <dt>Sample rate</dt>
              <dd id="sampleRate">--</dd>
            </div>
            <div>
              <dt>Audio frames/s</dt>
              <dd id="framesPerSecond">--</dd>
            </div>
            <div>
              <dt>Latency</dt>
              <dd id="latency">--</dd>
            </div>
            <div>
              <dt>Level</dt>
              <dd id="level">--</dd>
            </div>
          </dl>
        </section>

        <canvas id="spectrogram" width="960" height="420" aria-label="Rolling spectrogram"></canvas>

        <section class="harmonics" aria-labelledby="harmonics-title">
          <div class="harmonics-heading">
            <div>
              <h2 id="harmonics-title">Harmonics</h2>
              <p id="pitchState" role="status">No pitch detected</p>
            </div>
            <div id="harmonicToggles" class="harmonic-toggles" aria-label="Harmonic guide visibility"></div>
          </div>
          <div class="table-wrap">
            <table>
              <caption class="sr-only">Live harmonic measurements</caption>
              <thead>
                <tr><th scope="col">Track</th><th scope="col">Guide n×F0</th><th scope="col">Measured peak</th><th scope="col">Level</th><th scope="col">State</th></tr>
              </thead>
              <tbody id="harmonicRows"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
